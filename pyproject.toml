[project]
name = "assistant-agent"
version = "0.1.0"
description = "Small project for master's degree thesis at Universidad Politecnica de Madrid"
readme = "README.md"
authors = [
    { name = "Eisler Aguilar", email = "39389514+Eisler18@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dateparser>=1.3.0",
    "gradio>=6.9.0",
    "langchain-core>=1.3,<2.0",
    "langchain-google-genai>=2.0.0,<3.0.0",
    "langchain-openai>=1.2.1",
    "langgraph>=1.1,<1.2",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langsmith>=0.3.45,<1.0.0",
    "psycopg[binary,pool]>=3.3.5",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
]

[project.scripts]
assistant-agent = "app:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pylint>=4.0.5",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "pytest-env>=1.1.3",
]

[tool.pylint.messages_control]
disable = [
    "C0111"  # missing-docstring
]

[tool.pylint.format]
max-line-length = 100
indent-string = "  "

[tool.pylint.design]
max-attributes = 10
max-locals = 15

[tool.pylint.typecheck]
ignored-modules = ["gradio"]

[tool.pylint.basic]
good-names = ["i", "j", "k", "ex", "Run", "_", "id", "x", "y", "z"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=src --cov-report=xml --cov-report=html --cov-report=term-missing"
env = [
    "LANGCHAIN_TRACING_V2=false",
    "ENVIRONMENT=test",
    # Default TEST_DATABASE_URL to empty so the default `pytest` run stays
    # DB-free even if .env sets one. The "D:" prefix only applies this when
    # the variable isn't already present in the environment at pytest
    # startup (before .env is loaded) — so explicitly exporting it inline
    # still opts in to the Postgres checkpointer integration tests:
    #   TEST_DATABASE_URL=... uv run pytest tests/.../test_checkpointer.py
    "D:TEST_DATABASE_URL="
]
filterwarnings = [
    "ignore:The default value of `allowed_objects` will change in a future version.*:langchain_core._api.deprecation.LangChainPendingDeprecationWarning",
]
markers = [
    "unit: unit tests",
    "integration: integration tests",
]

[tool.coverage.run]
omit = ["*/__init__.py"]

