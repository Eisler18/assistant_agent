services:
  assistant-agent:
    build:
      context: .
    image: assistant-agent
    container_name: assistant-agent
    env_file:
      - .env
    ports:
      - "7860:7860"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860', timeout=5).read()\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped