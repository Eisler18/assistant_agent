services:
  postgres:
    image: postgres:16-alpine
    container_name: assistant-agent-postgres
    environment:
      POSTGRES_USER: assistant_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: assistant_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant_agent -d assistant_agent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  assistant-agent:
    build:
      context: .
    image: assistant-agent
    container_name: assistant-agent
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
    ports:
      - "7860:7860"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860', timeout=5).read()\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
